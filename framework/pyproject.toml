[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-audit"
version = "0.1.0"
description = "Spatial Cell-Cell Communication Audit and Confounding Diagnosis Framework"
readme = "README.md"
authors = [{ name = "Thesis Research Team" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "anndata>=0.9.0",
    "scanpy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
models = [
    "torch>=2.0.0",
    "xgboost>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ccc-audit = "ccc_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
