# Phase 2 baselines (see model_dev/plans/phase2_baselines.md)
seed: 42
receivers: [myeloid, tumour]
n_boot: 2000
reproduction_tolerance: 0.01
ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]
run_hgb: true
hgb:
  learning_rate: [0.05, 0.1]
  max_leaf_nodes: [15, 31]
  max_iter: 500
  max_rows: 60000
run_mlp: true
mlp:
  hidden: [256, 128]
  dropout: 0.1
  learning_rate: [0.001, 0.0003]
  weight_decay: 0.0001
  batch: 1024
  max_epochs: 100
  patience: 10
  seeds: [0, 1, 2]
